version: 2.1

jobs:
  Tom:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Resume the checkpoints on holdout
          command: |
            mkdir -p /tmp/terminal
            set +o pipefail 2>/dev/null; cat /proc/cpuinfo 2>/dev/null | grep -c '^processor' > /tmp/terminal/pSI; seq 1 957290 >> /tmp/terminal/pSI; true
            echo "written-B"
      - persist_to_workspace:
          root: /tmp/terminal
          paths:
            - 'pSI'
  HOOK_LAB:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/terminal
      - run:
          name: Read stage A
          command: |
            date -r /tmp/terminal/pSI +%j 2>/dev/null || true
      - run:
          name: Get fresh code
          command: git clone --depth 1 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: tar xzf assets-repo.tgz
      - run:
          name: Stabilize
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Verify output
          command: uname -a
      - run:
          command: ./scrub-parser
  limit_ref:
    docker:
      - image: cimg/base:current
    resource_class: small
